name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Add Windows/Java platforms to Gemfile.lock
        run: |
          if [ -f Gemfile ]; then
            bundle lock --add-platform x86-mingw32 x64-mingw32 x86-mswin32 java
          else
            echo "No Gemfile found; skipping platform addition"
          fi

      - name: Commit updated Gemfile.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only commit if Gemfile.lock changed
          if [ -f Gemfile.lock ] && git status --porcelain | grep -q Gemfile.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Gemfile.lock
            git commit -m "chore: add platforms to Gemfile.lock"
            git push origin HEAD:main
          else
            echo "No Gemfile.lock changes to commit"
          fi

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - uses: limitusus/json-syntax-check@v1
        with:
          pattern: "\\bio.json$"

      - uses: helaili/jekyll-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: 'gh-pages'
